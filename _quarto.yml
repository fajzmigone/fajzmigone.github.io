website:
  title: Franck Migone
  description: Economist and statistician working on data, public policy, and economic development.
  site-url: https://fajzmigone.github.io
  image: img/fmigone.jpg
  favicon: img/favicon.png

  navbar:
    pinned: true
    left:
      - icon: github
        aria-label: GitHub
        href: https://github.com/fmigone
      - icon: linkedin
        aria-label: LinkedIn
        href: https://www.linkedin.com/in/franck-migone/
      - icon: envelope
        aria-label: Email
        href: mailto:franckmigone@gmail.com
    right:
      - text: Research
        href: research/index.qmd
      - text: Teaching
        href: Useful_Ressources/index.qmd
      - text: CV
        href: cv/index.qmd
      - text: Econ Blog
        href: https://econpolicyml.substack.com/

  search:
    location: navbar
    type: overlay
  open-graph: true

  page-footer:
    left: |
      <span class='faux-block'>&#169; 2026 Franck Migone</span>
    right: |
      <a href='https://creativecommons.org/licenses/by-sa/4.0/' target='_blank'>CC BY-SA 4.0</a>

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - research/index.qmd
    - Useful_Ressources/index.qmd
    - cv/index.qmd
    - 404.qmd
  preview:
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    lang: en
    fontsize: 1.05em
    theme:
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    footnotes-hover: true
    link-external-newwindow: true
